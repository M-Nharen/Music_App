[build-system]
requires = ["setuptools>=64,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "qwertone-analyzer"
version = "0.6.0"
description = "Song analyzer for Qwertone: stems, beats, key, chords, sections and notes from audio or MIDI"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "mido>=1.3",
    "pretty_midi>=0.2.10",
    "mutagen>=1.45",   # synced lyrics in ID3 tags (SYLT); optional at runtime
]

[project.optional-dependencies]
# Machine-learning engines. torch itself is installed by setup.sh so it can
# pick the CPU-only or GPU build. basic-pitch is installed by setup.sh with
# --no-deps (its metadata pins TensorFlow, we run its ONNX model instead), so
# its real runtime needs are listed here.
models = [
    "torch>=2.1",
    "demucs>=4.0.1",
    "torchcrepe>=0.0.22",
    "onnxruntime>=1.17",
    "piano-transcription-inference>=0.0.6",
    "torchlibrosa",
    "audioread",
    "mir_eval>=0.6",
    "resampy>=0.2.2,<0.4.3",
    "scikit-learn",
    "setuptools<81",  # resampy 0.4.2 still imports pkg_resources
]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
qwertone-analyze = "qwertone_analyzer.cli:main"

[tool.setuptools]
packages = ["qwertone_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: needs the ML engines (torch, torchcrepe, basic-pitch, demucs)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
