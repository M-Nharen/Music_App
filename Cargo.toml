[package]
name = "qwertone"
version = "0.1.0"
edition = "2024"
description = "Play music on your laptop keyboard: low-latency synth, chords, song learning"
license = "MIT"
repository = "https://github.com/M-Nharen/Music_App"

[features]
default = ["pipewire"]
# Talk to PipeWire directly (lowest latency). Without it, ALSA is used,
# which on Arch goes through pipewire-alsa.
pipewire = ["cpal/pipewire"]

[dependencies]
anyhow = "1.0.105"
# FLAC decoding for the analyzer's stems (Jam mode, Part 7).
claxon = "0.4.3"
cpal = { version = "0.18.2", features = ["realtime"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37"
midly = { version = "0.5.3", default-features = false, features = ["std", "alloc"] }
rustfft = "6.4.1"
rustysynth = "1.3.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"

# Virtual MIDI out (Part 4b) through the ALSA sequencer (already used by cpal).
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Keep debug builds fast enough for real-time audio.
[profile.dev.package."*"]
opt-level = 2
